name: Test Code Examples

on:
  pull_request:
    paths:
      - 'static/code-examples/**'
      - 'docker-compose.yml'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - 'static/code-examples/**'
      - 'docker-compose.yml'

jobs:
  # ROS 2 Code Examples Testing
  test-ros2:
    runs-on: ubuntu-latest
    name: Test ROS 2 Examples
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull ROS 2 Docker image
        run: docker pull osrf/ros:humble-desktop-full

      - name: Run ROS 2 example tests
        run: |
          docker-compose run --rm ros2-test bash -c "
            source /opt/ros/humble/setup.bash &&
            cd /workspace/code &&
            if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi &&
            if [ -d tests ]; then python3 -m pytest tests/ -v; fi
          "

      - name: Validate ROS 2 package structure
        run: |
          docker-compose run --rm ros2-test bash -c "
            source /opt/ros/humble/setup.bash &&
            cd /workspace/code &&
            if [ -f package.xml ]; then colcon build --symlink-install; fi
          "

  # Gazebo Simulation Testing
  test-gazebo:
    runs-on: ubuntu-latest
    name: Test Gazebo Examples
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Gazebo Docker image
        run: docker pull osrf/ros:humble-desktop-full

      - name: Validate URDF models
        run: |
          docker-compose run --rm gazebo-test bash -c "
            source /opt/ros/humble/setup.bash &&
            cd /workspace/code/models &&
            for urdf in *.urdf; do
              if [ -f \$urdf ]; then
                echo 'Validating \$urdf'
                check_urdf \$urdf
              fi
            done
          "

      - name: Validate SDF models
        run: |
          docker-compose run --rm gazebo-test bash -c "
            cd /workspace/code/models &&
            for sdf in *.sdf; do
              if [ -f \$sdf ]; then
                echo 'Validating \$sdf'
                gz sdf -k \$sdf
              fi
            done
          "

      - name: Run Gazebo world tests
        run: |
          docker-compose run --rm gazebo-test bash -c "
            source /opt/ros/humble/setup.bash &&
            cd /workspace/code &&
            if [ -d tests ]; then python3 -m pytest tests/ -v; fi
          "

  # VLA Model Testing (CPU mode for CI)
  test-vla:
    runs-on: ubuntu-latest
    name: Test VLA Examples (CPU)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull PyTorch Docker image
        run: docker pull pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime

      - name: Install VLA dependencies
        run: |
          docker-compose run --rm vla-test bash -c "
            pip3 install transformers openvla-lib pytest
          "

      - name: Run VLA inference tests (CPU mode)
        run: |
          docker-compose run --rm vla-test bash -c "
            cd /workspace/code &&
            if [ -d tests ]; then
              python3 -m pytest tests/ -v --device=cpu -m 'not gpu_required'
            fi
          "

      - name: Validate VLA script syntax
        run: |
          docker-compose run --rm vla-test bash -c "
            cd /workspace/code &&
            for py in *.py; do
              if [ -f \$py ]; then
                echo 'Validating \$py'
                python3 -m py_compile \$py
              fi
            done
          "

  # Unity Script Validation (syntax only, no runtime)
  test-unity:
    runs-on: ubuntu-latest
    name: Validate Unity Scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET for C# compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Validate Unity C# scripts
        run: |
          cd static/code-examples/module2-simulation/unity
          for cs in **/*.cs; do
            if [ -f "$cs" ]; then
              echo "Validating $cs"
              dotnet build --no-restore || echo "Warning: $cs may require Unity-specific types"
            fi
          done

  # Code Quality Checks
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linters
        run: |
          pip install flake8 black pylint

      - name: Run flake8 (Python style)
        run: |
          find static/code-examples -name "*.py" -exec flake8 {} +

      - name: Run black (Python formatting)
        run: |
          find static/code-examples -name "*.py" -exec black --check {} +

      - name: Run pylint (Python linting)
        run: |
          find static/code-examples -name "*.py" -exec pylint {} + || true

  # Markdown Link Checker for code comments
  markdown-links:
    runs-on: ubuntu-latest
    name: Check Markdown Links
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check-config.json'
          use-quiet-mode: 'yes'
          folder-path: 'static/code-examples'

  # Report Test Results
  report:
    runs-on: ubuntu-latest
    name: Test Report
    needs: [test-ros2, test-gazebo, test-vla, test-unity, code-quality, markdown-links]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Code Example Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ROS 2 Tests: ${{ needs.test-ros2.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gazebo Tests: ${{ needs.test-gazebo.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- VLA Tests (CPU): ${{ needs.test-vla.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unity Validation: ${{ needs.test-unity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Link Checks: ${{ needs.markdown-links.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Isaac Sim and GPU-based VLA tests require manual validation due to hardware requirements." >> $GITHUB_STEP_SUMMARY
