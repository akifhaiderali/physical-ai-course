services:
  - type: web
    name: physical-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: book_chunks
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: HF_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: LOG_LEVEL
        value: INFO
