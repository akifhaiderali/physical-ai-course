<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <!-- Robot head -->
  <rect x="25" y="30" width="50" height="45" rx="5" fill="#667eea" stroke="#764ba2" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="40" cy="50" r="5" fill="#ffffff"/>
  <circle cx="60" cy="50" r="5" fill="#ffffff"/>
  <circle cx="40" cy="50" r="2.5" fill="#764ba2"/>
  <circle cx="60" cy="50" r="2.5" fill="#764ba2"/>

  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="20" stroke="#764ba2" stroke-width="2"/>
  <circle cx="50" cy="18" r="3" fill="#667eea" stroke="#764ba2" stroke-width="1.5"/>

  <!-- Mouth/smile -->
  <path d="M 38 62 Q 50 68 62 62" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Neural network nodes (AI element) -->
  <circle cx="15" cy="45" r="2.5" fill="#764ba2" opacity="0.6"/>
  <circle cx="85" cy="45" r="2.5" fill="#764ba2" opacity="0.6"/>
  <circle cx="15" cy="60" r="2.5" fill="#764ba2" opacity="0.6"/>
  <circle cx="85" cy="60" r="2.5" fill="#764ba2" opacity="0.6"/>

  <!-- Neural connections -->
  <line x1="15" y1="45" x2="25" y2="40" stroke="#764ba2" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="60" x2="25" y2="65" stroke="#764ba2" stroke-width="1" opacity="0.4"/>
  <line x1="85" y1="45" x2="75" y2="40" stroke="#764ba2" stroke-width="1" opacity="0.4"/>
  <line x1="85" y1="60" x2="75" y2="65" stroke="#764ba2" stroke-width="1" opacity="0.4"/>
</svg>
